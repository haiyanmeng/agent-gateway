apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-server1
  template:
    metadata:
      labels:
        app: mcp-server1
    spec:
      containers:
      - name: mcp-server1
        image: docker.io/hmeng/calculator:latest
        ports:
        - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: server1-svc
spec:
  selector:
    app: mcp-server1
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
  type: ClusterIP
