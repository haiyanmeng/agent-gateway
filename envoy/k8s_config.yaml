apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-deployment
  namespace: envoy-gateway-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
    spec:
      containers:
      - name: envoy
        image: envoyproxy/envoy:contrib-v1.36-latest
        imagePullPolicy: Always
        command: ["/usr/local/bin/envoy"]
        args: ["-c", "/etc/envoy/envoy.yaml", "-l", "trace", "--log-path", "/dev/stderr"]
        ports:
        - name: http
          containerPort: 10001
        volumeMounts:
        - name: envoy-config-volume
          mountPath: /etc/envoy/envoy.yaml
          subPath: deepwiki_calculator_k8s.yaml
      volumes:
      - name: envoy-config-volume
        configMap:
          name: envoy-config
      serviceAccountName: envoy-sa
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-service
  namespace: envoy-gateway-system
spec:
  type: ClusterIP
  selector:
    app: envoy
  ports:
  - protocol: TCP
    port: 10001 # Port for the service itself
    targetPort: 10001 # Port on the Envoy pod
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: envoy-sa
  namespace: envoy-gateway-system
