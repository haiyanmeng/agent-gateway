static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10001
    filter_chains:
      - filters:
        - name: envoy.filters.network.http_connection_manager
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            stat_prefix: ingress_http
            route_config:
              name: local_route
              virtual_hosts:
              - name: local_service
                domains: ["*"]
                routes:
                - match:
                    path: "/server1/mcp"
                  route:
                    cluster: mcp_service1
                    prefix_rewrite: "/mcp"
            http_filters:
            - name: envoy.filters.http.mcp
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.mcp.v3.Mcp
            - name: envoy.filters.http.rbac
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                rules:
                  action: ALLOW
                  policies:
                    "allow-anyone-to-initialize-and-list-tool":
                      principals:
                      - any: true
                      permissions:
                      - and_rules:
                          rules:
                          - or_rules:
                              rules:
                              - url_path:
                                  path:
                                    prefix: "/server1/mcp"
                          - sourced_metadata:
                              metadata_matcher: 
                                filter: "mcp_proxy"
                                path:
                                  - key: "method"
                                value:
                                  or_match:
                                    value_matchers:
                                    - string_match:
                                        exact: "initialize"
                                    - string_match:
                                        exact: "notifications/initialized"
                                    - string_match:
                                        exact: "tools/list"
                    "allow-admin-to-call-server1-subtract-tool":
                      principals:
                      - and_ids:
                          ids:
                          - url_path:
                              path:
                                prefix: "/server1/mcp"
                          - header:
                              name: "x-user-role"      # The header to check
                              string_match:
                                exact: "admin"      # The required role
                      permissions:
                      - and_rules:
                          rules:
                          - sourced_metadata:
                              metadata_matcher: 
                                filter: "mcp_proxy"
                                path:
                                  - key: "method"
                                value:
                                  string_match:
                                    exact: "tools/call"
                          - sourced_metadata:
                              metadata_matcher:
                                filter: "mcp_proxy"
                                path: 
                                  - key: "params"
                                  - key: "name"
                                value:
                                  string_match:
                                    exact: "subtract"
            - name: envoy.filters.http.router
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: mcp_service1
    type: STATIC
    load_assignment:
      cluster_name: mcp_service1
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 9000

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9002
