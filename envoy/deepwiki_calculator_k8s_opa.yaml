static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10001
    filter_chains:
      - filters:
        - name: envoy.filters.network.http_connection_manager
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            stat_prefix: ingress_http
            route_config:
              name: local_route
              virtual_hosts:
              - name: local_service
                domains: ["*"]
                routes:
                - match:
                    path: "/mcp-server1/mcp"
                  route:
                    weighted_clusters:
                      clusters:
                        - name: mcp-server1
                          weight: 100
                    prefix_rewrite: "/mcp"
                - match:
                    path: "/mcp-server2/mcp"
                  route:
                    weighted_clusters:
                      clusters:
                        - name: mcp-server2
                          weight: 100
                    prefix_rewrite: "/mcp"
                    # The host header will be rewritten to the upstream's hostname
                    host_rewrite_literal: mcp.deepwiki.com
            http_filters:
            - name: envoy.filters.http.jwt_authn
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                # Define the token issuers (providers)
                providers:
                  kubernetes_provider:
                    # This MUST match the 'iss' claim in the Kubernetes service account JWT
                    # issuer: https://kubernetes.default.svc.cluster.local # issuer of a KIND cluster
                    issuer: https://container.googleapis.com/v1/projects/haiyanmeng-gke-dev/locations/us-central1/clusters/cluster-1 # issuer of a GKE cluster
                    remote_jwks:
                      http_uri:
                        # This is the standard K8s OIDC JWKS endpoint
                        uri: https://kubernetes.default.svc/openid/v1/jwks
                        # This cluster must be defined in your static_resources
                        cluster: kubernetes_api_cluster
                        timeout: 5s
                      # Cache the keys for 1 hour to avoid spamming the API server
                      cache_duration: 3600s
                    from_headers:
                    - name: x-k8s-sa-token
                    claim_to_headers:
                    - claim_name: sub # example: system:serviceaccount:agent:sa1
                      header_name: x-user-role
                # Define rules for applying the filter
                rules:
                  # This rule applies the JWT check to all incoming requests
                  - match: { prefix: "/" }
                    requires:
                      # Specifies which provider to use for this rule
                      provider_name: kubernetes_provider
            - name: envoy.filters.http.mcp
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.mcp.v3.Mcp
            - name: envoy.filters.http.ext_authz
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                failure_mode_allow: false
                grpc_service:
                  envoy_grpc:
                    cluster_name: opa_authz_service
                  timeout: 5s
                # 👇 This is the critical configuration change
                with_request_body:
                  # Maximum number of bytes to buffer from the request body.
                  # This must be large enough to contain your largest expected MCP payload.
                  max_request_bytes: 8192 
                  # Setting this to true allows processing for partial messages, 
                  # useful in streaming scenarios, but often safe to use here.
                  allow_partial_message: true
            - name: envoy.filters.http.router
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: mcp-server1
    type: STRICT_DNS
    load_assignment:
      cluster_name: mcp-server1
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: server1-svc.mcp-server-calculator-system.svc.cluster.local
                port_value: 9000
  - name: mcp-server2
    type: LOGICAL_DNS
    load_assignment:
      cluster_name: mcp-server2
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: mcp.deepwiki.com
                port_value: 443
    transport_socket:     # Added this section to enable TLS for HTTPS
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: mcp.deepwiki.com # Server Name Indication is required for TLS handshake
  - name: kubernetes_api_cluster
    type: LOGICAL_DNS
    # Use port 443 for HTTPS
    load_assignment:
      cluster_name: kubernetes_api_cluster
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: kubernetes.default.svc
                port_value: 443
    # This section is critical for making HTTPS work
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: kubernetes.default.svc
        common_tls_context:
          validation_context:
            # This tells Envoy to trust the K8s API server's cert
            trusted_ca:
              filename: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
  - name: opa_authz_service
    type: STATIC
    lb_policy: ROUND_ROBIN
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {} # Use HTTP/2 for gRPC
    load_assignment:
      cluster_name: opa_authz_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              # Assuming OPA is running as a service named 'opa.envoy-gateway-system.svc.cluster.local'
              socket_address:
                address: 127.0.0.1
                port_value: 9191 # OPA's default port
admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9002
