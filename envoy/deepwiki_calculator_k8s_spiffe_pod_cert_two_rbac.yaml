# When Envoy uses the SDS API (even for local files), it needs to identify itself.
# This "node identity" is used for logging, metrics, and in more advanced scenarios, for fetching secrets from a remote management server.
# Even though we're using local files, the API structure still requires this identification. It doesn't know which Envoy is asking for the secret otherwise.
node:
  id: "envoy-sds-node"
  cluster: "envoy-sds-cluster"

static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10001
    filter_chains:
      - filters:
        - name: envoy.filters.network.http_connection_manager
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            stat_prefix: ingress_http
            route_config:
              name: local_route
              virtual_hosts:
              - name: local_service
                domains: ["*"]
                routes:
                # Optional: Add a health check or default route to avoid 404s on '/'

                - match:
                    path: "/mcp-server1/mcp"
                  route:
                    weighted_clusters:
                      clusters:
                        - name: mcp-server1
                          weight: 100
                          typed_per_filter_config:
                            envoy.filters.http.rbac.backend_level:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                              rbac:
                                rules:
                                  action: ALLOW
                                  policies:
                                    "allow-mcp-session-close":
                                      principals:
                                        # Both of the following conditions must be true for the request to match
                                        - and_ids:
                                            ids:
                                              # Condition 1: The HTTP method must be DELETE
                                              - header:
                                                  name: ":method"
                                                  string_match:
                                                    exact: "DELETE"
                                              # Condition 2: The 'mcp-session-id' header must exist
                                              - header:
                                                  name: "mcp-session-id"
                                                  present_match: true
                                      permissions:
                                        # If the principal (the request's identity) matches, allow it
                                        - any: true
                                    "allow-initialize-and-list-tool":
                                      principals:
                                      - any: true
                                      permissions:
                                      - and_rules:
                                          rules:
                                          - sourced_metadata:
                                              metadata_matcher:
                                                filter: "mcp_proxy"
                                                path:
                                                  - key: "method"
                                                value:
                                                  or_match:
                                                    value_matchers:
                                                    - string_match:
                                                        exact: "initialize"
                                                    - string_match:
                                                        exact: "notifications/initialized"
                                                    - string_match:
                                                        exact: "tools/list"
                                    "rule-0":
                                      principals:
                                      - authenticated:
                                          principal_name:
                                            exact: "spiffe://cluster.local/ns/agent-spiffe/sa/adk-agent-sa"
                                      permissions:
                                      - and_rules:
                                          rules:
                                          - sourced_metadata:
                                              metadata_matcher:
                                                filter: "mcp_proxy"
                                                path:
                                                  - key: "method"
                                                value:
                                                  string_match:
                                                    exact: "tools/call"
                                          - sourced_metadata:
                                              metadata_matcher:
                                                filter: "mcp_proxy"
                                                path:
                                                  - key: "params"
                                                  - key: "name"
                                                value:
                                                  or_match:
                                                    value_matchers:
                                                    - string_match:
                                                        exact: "add"
                                                    - string_match:
                                                        exact: "subtract"
                                    "rule-1":
                                      principals:
                                      - authenticated:
                                          principal_name:
                                            exact: "spiffe://my.trust.domain/ns/agent-spiffe/sa/sa2"
                                      permissions:
                                      - and_rules:
                                          rules:
                                          - sourced_metadata:
                                              metadata_matcher:
                                                filter: "mcp_proxy"
                                                path:
                                                  - key: "method"
                                                value:
                                                  string_match:
                                                    exact: "tools/call"
                                          - sourced_metadata:
                                              metadata_matcher:
                                                filter: "mcp_proxy"
                                                path:
                                                  - key: "params"
                                                  - key: "name"
                                                value:
                                                  string_match:
                                                    exact: "subtract"
                                    "allow-http-get":
                                      permissions:
                                        - header:
                                            name: ":method"
                                            string_match:
                                              exact: "GET"
                                      principals:
                                        - any: true
                    prefix_rewrite: "/mcp"
                - match:
                    path: "/mcp-server2/mcp"
                  route:
                    weighted_clusters:
                      clusters:
                        - name: mcp-server2
                          weight: 100
                          typed_per_filter_config:
                            envoy.filters.http.rbac.backend_level:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBACPerRoute
                              rbac:
                                rules:
                                  action: ALLOW
                                  policies:
                                    "allow-mcp-session-close":
                                      principals:
                                        # Both of the following conditions must be true for the request to match
                                        - and_ids:
                                            ids:
                                              # Condition 1: The HTTP method must be DELETE
                                              - header:
                                                  name: ":method"
                                                  string_match:
                                                    exact: "DELETE"
                                              # Condition 2: The 'mcp-session-id' header must exist
                                              - header:
                                                  name: "mcp-session-id"
                                                  present_match: true
                                      permissions:
                                        # If the principal (the request's identity) matches, allow it
                                        - any: true
                                    "allow-initialize-and-list-tool":
                                      principals:
                                      - any: true
                                      permissions:
                                      - and_rules:
                                          rules:
                                          - sourced_metadata:
                                              metadata_matcher:
                                                filter: "mcp_proxy"
                                                path:
                                                  - key: "method"
                                                value:
                                                  or_match:
                                                    value_matchers:
                                                    - string_match:
                                                        exact: "initialize"
                                                    - string_match:
                                                        exact: "notifications/initialized"
                                                    - string_match:
                                                        exact: "tools/list"
                                    "rule-0":
                                      principals:
                                      - authenticated:
                                          principal_name:
                                            exact: "spiffe://my.trust.domain/ns/agent-spiffe/sa/sa2"
                                      permissions:
                                      - and_rules:
                                          rules:
                                          - sourced_metadata:
                                              metadata_matcher:
                                                filter: "mcp_proxy"
                                                path:
                                                  - key: "method"
                                                value:
                                                  string_match:
                                                    exact: "tools/call"
                                          - sourced_metadata:
                                              metadata_matcher:
                                                filter: "mcp_proxy"
                                                path:
                                                  - key: "params"
                                                  - key: "name"
                                                value:
                                                  string_match:
                                                    exact: "read_wiki_structure"
                                    "allow-http-get":
                                      permissions:
                                        - header:
                                            name: ":method"
                                            string_match:
                                              exact: "GET"
                                      principals:
                                        - any: true
                    prefix_rewrite: "/mcp"
                    # The host header will be rewritten to the upstream's hostname
                    host_rewrite_literal: mcp.deepwiki.com
            http_filters:
            - name: envoy.filters.http.mcp
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.mcp.v3.Mcp
            - name: envoy.filters.http.rbac.gateway_level  # this RBAC comes from the AccessPolicy object targeting Gateway
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                rules:
                  action: DENY
                  policies:
                    "deny-anyone-to-use-add-tool":
                      principals:
                        - any: true
                      permissions:
                        - and_rules:
                            rules:
                              - sourced_metadata:
                                  metadata_matcher:
                                    filter: "mcp_proxy"
                                    path:
                                      - key: "method"
                                    value:
                                      string_match:
                                        exact: "tools/call"
                              - sourced_metadata:
                                  metadata_matcher:
                                    filter: "mcp_proxy"
                                    path:
                                      - key: "params"
                                      - key: "name"
                                    value:
                                      string_match:
                                        exact: "add"
            - name: envoy.filters.http.rbac.backend_level  # this RBAC comes from the AccessPolicy object targeting Backend
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
            - name: envoy.filters.http.router
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
        # reference: https://www.envoyproxy.io/docs/envoy/latest/configuration/security/secret#example-one-static-resource
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext
            common_tls_context:
              tls_certificate_sds_secret_configs:
              - name: "spiffe_identity"
                sds_config:
                  resource_api_version: V3
                  path_config_source:
                    path: "/etc/envoy/sds/spiffe_identity.yaml"
              validation_context_sds_secret_config:
                name: "spiffe_trust"
                sds_config:
                  resource_api_version: V3
                  path_config_source:
                    path: "/etc/envoy/sds/spiffe_trust.yaml"
            require_client_certificate: true

  clusters:
  - name: mcp-server1
    type: STRICT_DNS
    load_assignment:
      cluster_name: mcp-server1
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: server1-svc.mcp-server-calculator-system.svc.cluster.local
                port_value: 9000
  - name: mcp-server2
    type: LOGICAL_DNS
    # If your Kubernetes cluster or network does not fully support IPv6, LOGICAL_DNS might resolve to
    # an IPv6 address that Envoy cannot reach, resulting in a 503.
    # Force IPv4 to ensure stability in standard K8s networks
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: mcp-server2
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: mcp.deepwiki.com
                port_value: 443
    transport_socket:     # Added this section to enable TLS for HTTPS
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        sni: mcp.deepwiki.com # Server Name Indication is required for TLS handshake

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9002
