apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-agent-deployment
  labels:
    app: mcp-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-agent
  template:
    metadata:
      labels:
        app: mcp-agent
    spec:
      containers:
      - name: mcp-agent
        image: docker.io/hmeng/agent:v1
        imagePullPolicy: Always
        env:
        - name: MCP_SERVER_URL
          value: "http://server1-svc:9000/mcp" # Assuming mcp-server is the service name for the MCP server
        command: ["/bin/sh", "-c", "python agent.py && sleep infinity"]
        # Add resource limits and requests as appropriate for your environment
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "250m"
      serviceAccountName: sa1
