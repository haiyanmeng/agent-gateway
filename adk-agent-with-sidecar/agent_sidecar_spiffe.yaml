# When Envoy uses the SDS API (even for local files), it needs to identify itself.
# This "node identity" is used for logging, metrics, and in more advanced scenarios, for fetching secrets from a remote management server.
# Even though we're using local files, the API structure still requires this identification. It doesn't know which Envoy is asking for the secret otherwise.
node:
  id: "envoy-sds-node"
  cluster: "envoy-sds-cluster"

static_resources:
  listeners:
  - name: listener_0
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 10001
    filter_chains:
      - filters:
        - name: envoy.filters.network.http_connection_manager
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
            stat_prefix: ingress_http
            route_config:
              name: local_route
              virtual_hosts:
              - name: local_service
                domains: ["*"]
                routes:
                # Optional: Add a health check or default route to avoid 404s on '/'
                - match:
                    prefix: "/"
                  route:
                    cluster: envoy-gateway
                
            http_filters:
            - name: envoy.filters.http.router
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: envoy-gateway
    type: LOGICAL_DNS
    load_assignment:
      cluster_name: envoy-gateway
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: envoy-service.envoy-gateway-system.svc.cluster.local
                port_value: 10001
    transport_socket:
      name: envoy.transport_sockets.tls
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
        common_tls_context:
          tls_certificate_sds_secret_configs:
          - name: "spiffe_identity"
            sds_config:
              resource_api_version: V3
              path_config_source:
                path: "/etc/envoy/sds/spiffe_identity.yaml"
          validation_context_sds_secret_config:
            name: "spiffe_trust"
            sds_config:
              resource_api_version: V3
              path_config_source:
                path: "/etc/envoy/sds/spiffe_trust.yaml"

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9002
