apiVersion: apps/v1
kind: Deployment
metadata:
  name: server1
  namespace: mcp-server-calculator-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server1
  template:
    metadata:
      labels:
        app: server1
    spec:
      containers:
      - name: server1
        image: nginx
        ports:
        - containerPort: 80
